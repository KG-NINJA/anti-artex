name: synthetic-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run lab:validate
      - run: npm run benchmark:triage
      - run: node scripts/practitioner-complete.mjs
      - run: npm run portfolio:verify
      - run: npm run bundle
      - name: Preserve sanitized synthetic portfolio reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-security-portfolio
          path: |
            artifacts/lab/summary.json
            artifacts/lab/summary.md
            artifacts/triage/report.json
            artifacts/triage/report.md
            artifacts/practitioner/results.json
            artifacts/practitioner/report.md
            artifacts/practitioner/index.html
            artifacts/practitioner/manifest.json
          if-no-files-found: error
          retention-days: 30
